<!DOCTYPE html>
<html>
<head><title>Apply - Globex - Staff Platform Engineer</title></head>
<body>
<form data-testid="AshbyForm">
  <label for="5f2b-firstName">First name <span>*</span></label>
  <input type="text" id="5f2b-firstName" name="firstName" aria-required="true">

  <label for="5f2b-lastName">Last name <span>*</span></label>
  <input type="text" id="5f2b-lastName" name="lastName" aria-required="true">

  <label for="5f2b-email">Email <span>*</span></label>
  <input type="email" id="5f2b-email" name="email" aria-required="true">

  <label for="5f2b-phone">Phone</label>
  <input type="tel" id="5f2b-phone" name="phone">

  <label for="5f2b-resume">Resume/CV <span>*</span></label>
  <input type="file" id="5f2b-resume" name="resume" aria-required="true">

  <label for="5f2b-github">GitHub</label>
  <input type="text" id="5f2b-github" name="github">

  <span>Are you legally authorized to work in the United States? <span>*</span></span>
  <select id="5f2b-workauth" name="workAuthorization" aria-required="true">
    <option value="">Select an option</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label for="5f2b-notes">Anything else we should know?</label>
  <textarea id="5f2b-notes" name="notes"></textarea>

  <button type="submit">Submit</button>
</form>
</body>
</html>
