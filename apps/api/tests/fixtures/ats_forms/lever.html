<!DOCTYPE html>
<html>
<head><title>Apply - Initech - Senior Backend Engineer</title></head>
<body>
<form id="application-form">
  <label for="name">Full name</label>
  <input type="text" id="name" name="name" class="form-input">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" class="form-input">

  <label for="phone">Phone</label>
  <input type="text" id="phone" name="phone">

  <label for="resume">Resume</label>
  <input type="file" id="resume" name="resume">

  <label for="linkedinUrl">LinkedIn profile</label>
  <input type="text" id="linkedinUrl" name="linkedinUrl">

  <label for="portfolio">Personal website</label>
  <input type="text" id="portfolio" name="portfolio">

  <label for="years">Years of experience *</label>
  <input type="text" id="years" name="years" data-required="true">

  <p class="lev-form-error" style="display:none"></p>

  <input type="submit" value="Submit Application">
</form>
</body>
</html>
